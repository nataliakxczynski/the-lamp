<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Lamp</title>


<style>

/* ==================================================
   PAPER LAMP
   Warm / Concentrated Light
   ================================================== */

:root {

  --amber:
    rgba(255, 132, 45, 0.45);

}


/* ==================================================
   RESET
   ================================================== */

* {
  box-sizing:
    border-box;
}


html,
body {

  width:
    100%;

  height:
    100%;

  margin:
    0;

  padding:
    0;

  background:
    transparent;

}


body {

  overflow:
    hidden;

}


/* ==================================================
   LAMP AREA
   ================================================== */

.lamp-room {

  position:
    relative;

  width:
    100%;

  height:
    100%;

  min-height:
    180px;

  display:
    flex;

  align-items:
    center;

  justify-content:
    center;

  overflow:
    hidden;

  background:
    transparent;

}


/* ==================================================
   LAMP
   ================================================== */

.lamp {

  position:
    relative;

  width:
    min(62%, 260px);

  display:
    block;

  z-index:
    2;

  transition:
    filter 3s ease,
    transform 3s ease;

}


/* ==================================================
   CONCENTRATED LIGHT
   ================================================== */

.glow {

  position:
    absolute;

  width:
    min(32%, 125px);

  aspect-ratio:
    1;

  border-radius:
    50%;

  background:

    radial-gradient(
      circle,
      rgba(255, 133, 45, .28) 0%,
      rgba(255, 117, 32, .13) 35%,
      rgba(255, 100, 20, .04) 58%,
      transparent 75%
    );

  filter:
    blur(9px);

  opacity:
    0;

  z-index:
    1;

  transform:
    scale(.75);

  transition:
    opacity 3s ease,
    transform 4s ease;

}


/* ==================================================
   DAY
   ================================================== */

.lamp-room.day .glow {

  opacity:
    0;

  transform:
    scale(.75);

}


.lamp-room.day .lamp {

  filter:
    none;

}


/* ==================================================
   DUSK
   ================================================== */

.lamp-room.dusk .glow {

  opacity:
    .42;

  transform:
    scale(.88);

}


.lamp-room.dusk .lamp {

  filter:

    brightness(1.035)

    sepia(.16)

    saturate(1.12)

    drop-shadow(
      0 0 5px
      rgba(255, 120, 35, .20)
    );

}


/* ==================================================
   NIGHT
   ================================================== */

.lamp-room.lit .glow {

  opacity:
    .85;

  transform:
    scale(1);

}


.lamp-room.lit .lamp {

  filter:

    brightness(1.09)

    sepia(.28)

    saturate(1.28)

    drop-shadow(
      0 0 8px
      rgba(255, 112, 30, .32)
    );

}


/* ==================================================
   TEST CONTROLS
   ================================================== */

.controls {

  position:
    absolute;

  bottom:
    10px;

  left:
    50%;

  transform:
    translateX(-50%);

  z-index:
    10;

  display:
    flex;

  gap:
    7px;

  opacity:
    .45;

  transition:
    opacity .25s ease;

}


.controls:hover {

  opacity:
    .9;

}


.controls button {

  border:
    none;

  background:
    transparent;

  padding:
    3px 5px;

  font-family:
    Arial,
    sans-serif;

  font-size:
    7px;

  letter-spacing:
    .13em;

  color:
    #575149;

  cursor:
    pointer;

}


.controls button:hover {

  color:
    #24211e;

}


.controls button.active {

  text-decoration:
    underline;

  text-underline-offset:
    3px;

}


/* ==================================================
   MOBILE
   ================================================== */

@media (max-width: 420px) {

  .lamp {

    width:
      min(70%, 220px);

  }


  .glow {

    width:
      38%;

  }

}

</style>

</head>


<body>


<div
  class="lamp-room day"
  id="lampRoom"
>


  <!-- CONCENTRATED LIGHT -->

  <div
    class="glow"
    aria-hidden="true"
  ></div>


  <!-- LAMP -->

  <img
    src="lamp.png"
    class="lamp"
    alt=""
  >


  <!-- TEST CONTROLS -->

  <div class="controls">

    <button
      id="dayButton"
      onclick="setMode('day')"
    >
      DAY
    </button>


    <button
      id="duskButton"
      onclick="setMode('dusk')"
    >
      DUSK
    </button>


    <button
      id="nightButton"
      onclick="setMode('night')"
    >
      NIGHT
    </button>


    <button
      id="autoButton"
      onclick="setMode('auto')"
      class="active"
    >
      AUTO
    </button>

  </div>


</div>


<script>

/* ==================================================
   BARCELONA
   ================================================== */

const LATITUDE =
  41.3874;

const LONGITUDE =
  2.1686;


/* ==================================================
   ELEMENT
   ================================================== */

const lampRoom =
  document.getElementById(
    "lampRoom"
  );


const buttons = {

  day:
    document.getElementById(
      "dayButton"
    ),

  dusk:
    document.getElementById(
      "duskButton"
    ),

  night:
    document.getElementById(
      "nightButton"
    ),

  auto:
    document.getElementById(
      "autoButton"
    )

};


/* ==================================================
   SUNSET
   ================================================== */

function getSunset(date) {

  const day =
    Math.floor(
      (
        Date.UTC(
          date.getFullYear(),
          date.getMonth(),
          date.getDate()
        )
        -
        Date.UTC(
          date.getFullYear(),
          0,
          0
        )
      )
      /
      86400000
    );


  const radians =
    Math.PI / 180;


  const declination =
    -23.44 *
    Math.cos(
      radians *
      (
        360 / 365 *
        (day + 10)
      )
    );


  const hourAngle =
    Math.acos(

      (
        Math.cos(
          90.833 * radians
        )
        /
        (
          Math.cos(
            LATITUDE * radians
          )
          *
          Math.cos(
            declination * radians
          )
        )
      )
      -
      Math.tan(
        LATITUDE * radians
      )
      *
      Math.tan(
        declination * radians
      )

    ) / radians;


  const solarNoon =
    12
    -
    (
      LONGITUDE / 15
    );


  const sunsetHour =
    solarNoon
    +
    (
      hourAngle / 15
    );


  const sunset =
    new Date(date);


  sunset.setHours(
    Math.floor(sunsetHour),
    Math.round(
      (
        sunsetHour
        -
        Math.floor(sunsetHour)
      )
      * 60
    ),
    0,
    0
  );


  return sunset;

}


/* ==================================================
   APPLY MODE
   ================================================== */

function applyMode(mode) {

  lampRoom.classList.remove(
    "day",
    "dusk",
    "lit"
  );


  if (mode === "day") {

    lampRoom.classList.add(
      "day"
    );

  }


  if (mode === "dusk") {

    lampRoom.classList.add(
      "dusk"
    );

  }


  if (mode === "night") {

    lampRoom.classList.add(
      "lit"
    );

  }


  Object.keys(buttons)
    .forEach(
      key => {

        buttons[key]
          .classList.toggle(
            "active",
            key === mode
          );

      }
    );

}


/* ==================================================
   AUTO
   ================================================== */

function updateAuto() {

  const now =
    new Date();


  const sunset =
    getSunset(now);


  const duskStart =
    new Date(
      sunset.getTime()
      -
      45 * 60 * 1000
    );


  if (now >= sunset) {

    applyMode(
      "night"
    );

  }

  else if (
    now >= duskStart
  ) {

    applyMode(
      "dusk"
    );

  }

  else {

    applyMode(
      "day"
    );

  }

}


/* ==================================================
   TEST MODE
   ================================================== */

function setMode(mode) {

  if (
    mode === "auto"
  ) {

    updateAuto();

  }

  else {

    applyMode(
      mode
    );

  }

}


/* ==================================================
   START
   ================================================== */

updateAuto();


setInterval(
  () => {

    if (
      buttons.auto
        .classList
        .contains("active")
    ) {

      updateAuto();

    }

  },
  60000
);

</script>


</body>

</html>
```
