<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Lamp</title>


<style>

/* ==================================================
   PAPER LAMP
   Akari-inspired / Warm Orange Interior
   ================================================== */

:root {

  --orange:
    #f98021;

}


/* ==================================================
   RESET
   ================================================== */

* {
  box-sizing:
    border-box;
}


html,
body {

  width:
    100%;

  height:
    100%;

  margin:
    0;

  padding:
    0;

  background:
    transparent;

}


body {

  overflow:
    hidden;

}


/* ==================================================
   LAMP AREA
   ================================================== */

.lamp-room {

  position:
    relative;

  width:
    100%;

  height:
    100%;

  min-height:
    180px;

  display:
    flex;

  align-items:
    center;

  justify-content:
    center;

  overflow:
    hidden;

  background:
    transparent;

}


/* ==================================================
   LAMP WRAPPER
   ================================================== */

.lamp-wrapper {

  position:
    relative;

  width:
    min(62%, 260px);

  z-index:
    2;

}


/* ==================================================
   ORIGINAL LAMP
   ================================================== */

.lamp {

  position:
    relative;

  width:
    100%;

  height:
    auto;

  display:
    block;

  z-index:
    3;

  transition:
    filter 3s ease;

}


/* ==================================================
   INNER ORANGE LAYER
   ==================================================

   This layer uses the PNG itself as a mask,
   so the orange remains inside the lamp.
   ================================================== */

.inner-light {

  position:
    absolute;

  inset:
    0;

  z-index:
    4;

  pointer-events:
    none;

  background:
    var(--orange);

  opacity:
    0;

  mix-blend-mode:
    multiply;

  -webkit-mask-image:
    url("lamp.png");

  mask-image:
    url("lamp.png");

  -webkit-mask-repeat:
    no-repeat;

  mask-repeat:
    no-repeat;

  -webkit-mask-position:
    center;

  mask-position:
    center;

  -webkit-mask-size:
    contain;

  mask-size:
    contain;

  transition:
    opacity 3s ease;

}


/* ==================================================
   SECOND INNER LIGHT
   ==================================================

   A softer layer gives the paper some warmth
   without destroying the texture.
   ================================================== */

.inner-warmth {

  position:
    absolute;

  inset:
    0;

  z-index:
    5;

  pointer-events:
    none;

  background:
    rgba(249, 128, 33, .55);

  opacity:
    0;

  mix-blend-mode:
    soft-light;

  -webkit-mask-image:
    url("lamp.png");

  mask-image:
    url("lamp.png");

  -webkit-mask-repeat:
    no-repeat;

  mask-repeat:
    no-repeat;

  -webkit-mask-position:
    center;

  mask-position:
    center;

  -webkit-mask-size:
    contain;

  mask-size:
    contain;

  transition:
    opacity 3s ease;

}


/* ==================================================
   CONCENTRATED OUTER LIGHT
   ================================================== */

.glow {

  position:
    absolute;

  width:
    min(50%, 260px);

  aspect-ratio:
    1;

  border-radius:
    50%;

  background:

    radial-gradient(
      circle,

      rgba(249, 128, 33, .26)
      0%,

      rgba(249, 128, 33, .12)
      30%,

      rgba(249, 128, 33, .035)
      52%,

      transparent
      70%
    );

  filter:
    blur(8px);

  opacity:
    0;

  z-index:
    1;

  transform:
    scale(.72);

  transition:
    opacity 3s ease,
    transform 4s ease;

}


/* ==================================================
   DAY
   ================================================== */

.lamp-room.day .glow {

  opacity:
    0;

}


.lamp-room.day .inner-light {

  opacity:
    0;

}


.lamp-room.day .inner-warmth {

  opacity:
    0;

}


.lamp-room.day .lamp {

  filter:
    none;

}


/* ==================================================
   DUSK
   ================================================== */

.lamp-room.dusk .glow {

  opacity:
    .38;

  transform:
    scale(.88);

}


.lamp-room.dusk .inner-light {

  opacity:
    .18;

}


.lamp-room.dusk .inner-warmth {

  opacity:
    .10;

}


.lamp-room.dusk .lamp {

  filter:
    saturate(1.08)
    sepia(.08)
    drop-shadow(
      0 0 4px
      rgba(249, 128, 33, .18)
    );

}


/* ==================================================
   NIGHT
   ================================================== */

.lamp-room.lit .glow {

  opacity:
    .72;

  transform:
    scale(.98);

}


.lamp-room.lit .inner-light {

  opacity:
    .32;

}


.lamp-room.lit .inner-warmth {

  opacity:
    .18;

}


.lamp-room.lit .lamp {

  filter:

    saturate(1.22)

    sepia(.5)

    drop-shadow(
      0 0 7px
      rgba(249, 128, 33, .28)
    );

}


/* ==================================================
   SUBTLE OUTER AMBIENT LIGHT
   ================================================== */

.lamp-room::after {

  content:
    "";

  position:
    absolute;

  width:
    min(20%, 80px);

  aspect-ratio:
    1;

  border-radius:
    50%;

  background:
    var(--orange);

  filter:
    blur(24px);

  opacity:
    0;

  z-index:
    1;

  transition:
    opacity 3s ease;

}


.lamp-room.dusk::after {

  opacity:
    .06;

}


.lamp-room.lit::after {

  opacity:
    .12;

}


/* ==================================================
   LAMP SIZE ON SMALL SCREENS
   ================================================== */

@media (max-width: 420px) {

  .lamp-wrapper {

    width:
      min(70%, 220px);

  }


  .glow {

    width:
      36%;

  }

}


/* ==================================================
   TEST CONTROLS
   ================================================== */

.controls {

  position:
    absolute;

  bottom:
    10px;

  left:
    50%;

  transform:
    translateX(-50%);

  z-index:
    20;

  display:
    flex;

  gap:
    7px;

  opacity:
    .45;

  transition:
    opacity .25s ease;

}


.controls:hover {

  opacity:
    .9;

}


.controls button {

  border:
    none;

  background:
    transparent;

  padding:
    3px 5px;

  font-family:
    Arial,
    sans-serif;

  font-size:
    7px;

  letter-spacing:
    .13em;

  color:
    #575149;

  cursor:
    pointer;

}


.controls button:hover {

  color:
    #24211e;

}


.controls button.active {

  text-decoration:
    underline;

  text-underline-offset:
    3px;

}

</style>

</head>


<body>


<div
  class="lamp-room day"
  id="lampRoom"
>


  <!-- OUTER LIGHT -->

  <div
    class="glow"
    aria-hidden="true"
  ></div>


  <!-- LAMP -->

  <div class="lamp-wrapper">

    <img
      src="lamp.png"
      class="lamp"
      alt=""
    >


    <!-- INNER ORANGE -->

    <div
      class="inner-light"
      aria-hidden="true"
    ></div>


    <!-- SOFT WARMTH -->

    <div
      class="inner-warmth"
      aria-hidden="true"
    ></div>

  </div>


  <!-- TEST CONTROLS -->

  <div class="controls">

    <button
      id="dayButton"
      onclick="setMode('day')"
    >
      DAY
    </button>


    <button
      id="duskButton"
      onclick="setMode('dusk')"
    >
      DUSK
    </button>


    <button
      id="nightButton"
      onclick="setMode('night')"
    >
      NIGHT
    </button>


    <button
      id="autoButton"
      onclick="setMode('auto')"
      class="active"
    >
      AUTO
    </button>

  </div>


</div>


<script>

/* ==================================================
   BARCELONA
   ================================================== */

const LATITUDE =
  41.3874;

const LONGITUDE =
  2.1686;


/* ==================================================
   ELEMENTS
   ================================================== */

const lampRoom =
  document.getElementById(
    "lampRoom"
  );


const buttons = {

  day:
    document.getElementById(
      "dayButton"
    ),

  dusk:
    document.getElementById(
      "duskButton"
    ),

  night:
    document.getElementById(
      "nightButton"
    ),

  auto:
    document.getElementById(
      "autoButton"
    )

};


/* ==================================================
   SUNSET
   ================================================== */

function getSunset(date) {

  const day =
    Math.floor(
      (
        Date.UTC(
          date.getFullYear(),
          date.getMonth(),
          date.getDate()
        )
        -
        Date.UTC(
          date.getFullYear(),
          0,
          0
        )
      )
      /
      86400000
    );


  const radians =
    Math.PI / 180;


  const declination =
    -23.44 *
    Math.cos(
      radians *
      (
        360 / 365 *
        (day + 10)
      )
    );


  const hourAngle =
    Math.acos(

      (
        Math.cos(
          90.833 * radians
        )
        /
        (
          Math.cos(
            LATITUDE * radians
          )
          *
          Math.cos(
            declination * radians
          )
        )
      )
      -
      Math.tan(
        LATITUDE * radians
      )
      *
      Math.tan(
        declination * radians
      )

    ) / radians;


  const solarNoon =
    12
    -
    (
      LONGITUDE / 15
    );


  const sunsetHour =
    solarNoon
    +
    (
      hourAngle / 15
    );


  const sunset =
    new Date(date);


  sunset.setHours(
    Math.floor(
      sunsetHour
    ),
    Math.round(
      (
        sunsetHour
        -
        Math.floor(
          sunsetHour
        )
      )
      * 60
    ),
    0,
    0
  );


  return sunset;

}


/* ==================================================
   APPLY MODE
   ================================================== */

function applyMode(mode) {

  lampRoom.classList.remove(
    "day",
    "dusk",
    "lit"
  );


  if (mode === "day") {

    lampRoom.classList.add(
      "day"
    );

  }


  if (mode === "dusk") {

    lampRoom.classList.add(
      "dusk"
    );

  }


  if (mode === "night") {

    lampRoom.classList.add(
      "lit"
    );

  }


  Object.keys(buttons)
    .forEach(
      key => {

        buttons[key]
          .classList.toggle(
            "active",
            key === mode
          );

      }
    );

}


/* ==================================================
   AUTO MODE
   ================================================== */

function updateAuto() {

  const now =
    new Date();


  const sunset =
    getSunset(now);


  const duskStart =
    new Date(
      sunset.getTime()
      -
      45 * 60 * 1000
    );


  if (now >= sunset) {

    applyMode(
      "night"
    );

  }

  else if (
    now >= duskStart
  ) {

    applyMode(
      "dusk"
    );

  }

  else {

    applyMode(
      "day"
    );

  }

}


/* ==================================================
   TEST MODE
   ================================================== */

function setMode(mode) {

  if (
    mode === "auto"
  ) {

    updateAuto();

  }

  else {

    applyMode(
      mode
    );

  }

}


/* ==================================================
   START
   ================================================== */

updateAuto();


setInterval(
  () => {

    if (
      buttons.auto
        .classList
        .contains("active")
    ) {

      updateAuto();

    }

  },
  60000
);

</script>


</body>

</html>
```
