<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Lamp</title>


<style>

/* ==================================================
   AKARI PAPER LAMP
   ================================================== */

:root {

  --orange:
    #f98021;

}


/* ==================================================
   RESET
   ================================================== */

* {
  box-sizing:
    border-box;
}


html,
body {

  width:
    100%;

  height:
    100%;

  margin:
    0;

  padding:
    0;

  background:
    transparent;

}


body {

  overflow:
    hidden;

}


/* ==================================================
   LAMP AREA
   ================================================== */

.lamp-room {

  position:
    relative;

  width:
    100%;

  height:
    100%;

  min-height:
    180px;

  display:
    flex;

  align-items:
    center;

  justify-content:
    center;

  overflow:
    hidden;

  background:
    transparent;

}


/* ==================================================
   LAMP WRAPPER
   ================================================== */

.lamp-wrapper {

  position:
    relative;

  width:
    min(62%, 260px);

  z-index:
    2;

}


/* ==================================================
   ORIGINAL PAPER
   ================================================== */

.lamp {

  position:
    relative;

  width:
    100%;

  height:
    auto;

  display:
    block;

  z-index:
    3;

  transition:
    filter 3s ease;

}


/* ==================================================
   LUMINOUS COPY
   ==================================================

   This is a second copy of the actual lamp.

   It follows exactly the same silhouette,
   so the light appears INSIDE the lamp.
   ================================================== */

.lamp-light {

  position:
    absolute;

  inset:
    0;

  width:
    100%;

  height:
    100%;

  object-fit:
    contain;

  z-index:
    4;

  pointer-events:
    none;

  opacity:
    0;

  /*
     Orange light added to the actual silhouette.
  */

  filter:

    sepia(1)

    saturate(7)

    hue-rotate(
      325deg
    )

    brightness(1.35);

  mix-blend-mode:
    screen;

  transition:
    opacity 3s ease;

}


/* ==================================================
   INTERNAL LIGHT CORE
   ==================================================

   A small concentrated warm area gives the
   impression of an actual bulb/light source
   rather than simply colouring the paper.
   ================================================== */

.light-core {

  position:
    absolute;

  left:
    50%;

  top:
    50%;

  width:
    35%;

  height:
    48%;

  transform:
    translate(
      -50%,
      -50%
    );

  border-radius:
    50%;

  background:

    radial-gradient(
      ellipse,

      rgba(255, 185, 95, .58)
      0%,

      rgba(249, 128, 33, .30)
      30%,

      rgba(249, 128, 33, .10)
      58%,

      transparent
      80%
    );

  filter:
    blur(10px);

  opacity:
    0;

  z-index:
    5;

  pointer-events:
    none;

  transition:
    opacity 3s ease;

}


/* ==================================================
   OUTER GLOW
   ================================================== */

.glow {

  position:
    absolute;

  width:
    31%;

  height:
    65%;

  left:
    50%;

  top:
    50%;

  transform:
    translate(
      -50%,
      -50%
    )
    scale(.72);

  border-radius:
    50%;

  background:

    radial-gradient(
      ellipse at center,

      rgba(249, 128, 33, .48)
      0%,

      rgba(249, 128, 33, .27)
      28%,

      rgba(249, 128, 33, .10)
      48%,

      rgba(249, 128, 33, .025)
      65%,

      transparent
      78%
    );

  filter:
    blur(10px);

  opacity:
    0;

  z-index:
    1;

  transition:
    opacity 3s ease,
    transform 4s ease;

}


/* ==================================================
   DAY
   ================================================== */

.lamp-room.day .lamp {

  filter:
    none;

}


.lamp-room.day .lamp-light {

  opacity:
    0;

}


.lamp-room.day .light-core {

  opacity:
    0;

}


.lamp-room.day .glow {

  opacity:
    0;

  transform:
    translate(
      -50%,
      -50%
    )
    scale(.72);

}


/* ==================================================
   DUSK
   ================================================== */

.lamp-room.dusk .lamp {

  filter:
    brightness(1.025);

}


.lamp-room.dusk .lamp-light {

  opacity:
    .18;

}


.lamp-room.dusk .light-core {

  opacity:
    .18;

}


.lamp-room.dusk .glow {

  opacity:
    .40;

  transform:
    translate(
      -50%,
      -50%
    )
    scale(.88);

}


/* ==================================================
   NIGHT
   ================================================== */

.lamp-room.lit .lamp {

  /*
     Slight brightness increase gives the paper
     the feeling of being illuminated.
  */

  filter:
    brightness(1.10);

}


.lamp-room.lit .lamp-light {

  opacity:
    .58;

}


.lamp-room.lit .light-core {

  opacity:
    .62;

}


.lamp-room.lit .glow {

  opacity:
    .90;

  transform:
    translate(
      -50%,
      -50%
    )
    scale(1.05);

}


/* ==================================================
   RESPONSIVE
   ================================================== */

@media (max-width: 420px) {

  .lamp-wrapper {

    width:
      min(70%, 220px);

  }


  .glow {

    width:
      36%;

    height:
      68%;

  }


  .light-core {

    width:
      38%;

    height:
      50%;

  }

}


/* ==================================================
   TEST CONTROLS
   ================================================== */

.controls {

  position:
    absolute;

  bottom:
    10px;

  left:
    50%;

  transform:
    translateX(-50%);

  z-index:
    20;

  display:
    flex;

  gap:
    7px;

  opacity:
    .45;

  transition:
    opacity .25s ease;

}


.controls:hover {

  opacity:
    .9;

}


.controls button {

  border:
    none;

  background:
    transparent;

  padding:
    3px 5px;

  font-family:
    Arial,
    sans-serif;

  font-size:
    7px;

  letter-spacing:
    .13em;

  color:
    #575149;

  cursor:
    pointer;

}


.controls button:hover {

  color:
    #24211e;

}


.controls button.active {

  text-decoration:
    underline;

  text-underline-offset:
    3px;

}

</style>

</head>


<body>


<div
  class="lamp-room day"
  id="lampRoom"
>


  <!-- OUTER GLOW -->

  <div
    class="glow"
    aria-hidden="true"
  ></div>


  <!-- LAMP -->

  <div class="lamp-wrapper">


    <!-- ORIGINAL PAPER -->

    <img
      src="lamp.png"
      class="lamp"
      alt=""
    >


    <!-- LUMINOUS COPY -->

    <img
      src="lamp.png"
      class="lamp-light"
      alt=""
    >


    <!-- INTERNAL LIGHT CORE -->

    <div
      class="light-core"
      aria-hidden="true"
    ></div>


  </div>


  <!-- TEST CONTROLS -->

  <div class="controls">

    <button
      id="dayButton"
      onclick="setMode('day')"
    >
      DAY
    </button>


    <button
      id="duskButton"
      onclick="setMode('dusk')"
    >
      DUSK
    </button>


    <button
      id="nightButton"
      onclick="setMode('night')"
    >
      NIGHT
    </button>


    <button
      id="autoButton"
      onclick="setMode('auto')"
      class="active"
    >
      AUTO
    </button>

  </div>


</div>


<script>

/* ==================================================
   BARCELONA
   ================================================== */

const LATITUDE =
  41.3874;

const LONGITUDE =
  2.1686;


/* ==================================================
   ELEMENTS
   ================================================== */

const lampRoom =
  document.getElementById(
    "lampRoom"
  );


const buttons = {

  day:
    document.getElementById(
      "dayButton"
    ),

  dusk:
    document.getElementById(
      "duskButton"
    ),

  night:
    document.getElementById(
      "nightButton"
    ),

  auto:
    document.getElementById(
      "autoButton"
    )

};


/* ==================================================
   SUNSET CALCULATION
   ================================================== */

function getSunset(date) {

  const day =
    Math.floor(

      (
        Date.UTC(
          date.getFullYear(),
          date.getMonth(),
          date.getDate()
        )

        -

        Date.UTC(
          date.getFullYear(),
          0,
          0
        )

      )

      /

      86400000

    );


  const radians =
    Math.PI / 180;


  const declination =
    -23.44 *

    Math.cos(

      radians *

      (
        360 / 365 *
        (day + 10)
      )

    );


  const hourAngle =
    Math.acos(

      (
        Math.cos(
          90.833 * radians
        )

        /

        (
          Math.cos(
            LATITUDE * radians
          )

          *

          Math.cos(
            declination * radians
          )

        )

      )

      -

      Math.tan(
        LATITUDE * radians
      )

      *

      Math.tan(
        declination * radians
      )

    )

    /

    radians;


  const solarNoon =
    12 -
    (
      LONGITUDE / 15
    );


  const sunsetHour =
    solarNoon +
    (
      hourAngle / 15
    );


  const sunset =
    new Date(date);


  sunset.setHours(

    Math.floor(
      sunsetHour
    ),

    Math.round(

      (
        sunsetHour -

        Math.floor(
          sunsetHour
        )

      )

      * 60

    ),

    0,
    0

  );


  return sunset;

}


/* ==================================================
   APPLY MODE
   ================================================== */

function applyMode(mode) {

  lampRoom.classList.remove(
    "day",
    "dusk",
    "lit"
  );


  if (mode === "day") {

    lampRoom.classList.add(
      "day"
    );

  }


  if (mode === "dusk") {

    lampRoom.classList.add(
      "dusk"
    );

  }


  if (mode === "night") {

    lampRoom.classList.add(
      "lit"
    );

  }


  Object.keys(buttons)
    .forEach(
      key => {

        buttons[key]
          .classList.toggle(
            "active",
            key === mode
          );

      }
    );

}


/* ==================================================
   AUTO MODE
   ================================================== */

function updateAuto() {

  const now =
    new Date();


  const sunset =
    getSunset(now);


  const duskStart =
    new Date(

      sunset.getTime()

      -

      45 * 60 * 1000

    );


  if (now >= sunset) {

    applyMode(
      "night"
    );

  }

  else if (
    now >= duskStart
  ) {

    applyMode(
      "dusk"
    );

  }

  else {

    applyMode(
      "day"
    );

  }

}


/* ==================================================
   TEST MODE
   ================================================== */

function setMode(mode) {

  if (
    mode === "auto"
  ) {

    updateAuto();

  }

  else {

    applyMode(
      mode
    );

  }

}


/* ==================================================
   START
   ================================================== */

updateAuto();


setInterval(

  () => {

    if (

      buttons.auto
        .classList
        .contains("active")

    ) {

      updateAuto();

    }

  },

  60000

);

</script>


</body>

</html>
```
