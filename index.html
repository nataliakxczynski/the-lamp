<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Lamp</title>


<style>

/* ==================================================
   PAPER LAMP
   Transparent Notion Widget
   Barcelona
   ================================================== */

:root {

  --warm-light:
    rgba(255, 213, 143, 0.75);

}


/* ==================================================
   RESET
   ================================================== */

* {
  box-sizing: border-box;
}


html,
body {

  width: 100%;
  height: 100%;

  margin: 0;
  padding: 0;

  background: transparent;

}


/* ==================================================
   LAMP AREA
   ================================================== */

.lamp-room {

  position: relative;

  width: 100%;
  height: 100%;

  min-height: 180px;

  display: flex;

  align-items: center;
  justify-content: center;

  overflow: hidden;

  background: transparent;

}


/* ==================================================
   LAMP
   ================================================== */

.lamp {

  position: relative;

  width: min(62%, 260px);

  display: block;

  z-index: 2;

  transition:
    filter 3s ease,
    transform 3s ease;

}


/* ==================================================
   LIGHT GLOW
   ================================================== */

.glow {

  position: absolute;

  width: min(55%, 220px);

  aspect-ratio: 1;

  border-radius: 50%;

  background:

    radial-gradient(
      circle,
      var(--warm-light) 0%,
      rgba(255, 205, 125, 0.28) 28%,
      rgba(255, 190, 100, 0.10) 48%,
      transparent 72%
    );

  filter:
    blur(14px);

  opacity: 0;

  z-index: 1;

  transform:
    scale(.75);

  transition:
    opacity 4s ease,
    transform 5s ease;

}


/* ==================================================
   DAY
   ================================================== */

.lamp-room.day .glow {

  opacity: 0;

  transform:
    scale(.75);

}


.lamp-room.day .lamp {

  filter:
    none;

}


/* ==================================================
   DUSK
   ================================================== */

.lamp-room.dusk .glow {

  opacity: .35;

  transform:
    scale(.92);

}


.lamp-room.dusk .lamp {

  filter:
    brightness(1.035)
    sepia(.055)
    drop-shadow(
      0 0 5px
      rgba(255, 211, 145, .12)
    );

}


/* ==================================================
   NIGHT
   ================================================== */

.lamp-room.lit .glow {

  opacity: 1;

  transform:
    scale(1.15);

}


.lamp-room.lit .lamp {

  filter:
    brightness(1.10)
    sepia(.12)
    drop-shadow(
      0 0 13px
      rgba(255, 211, 145, .32)
    );

}


/* ==================================================
   TEST CONTROLS
   ================================================== */

.controls {

  position:
    absolute;

  bottom:
    10px;

  left:
    50%;

  transform:
    translateX(-50%);

  z-index:
    10;

  display:
    flex;

  gap:
    7px;

  opacity:
    .45;

  transition:
    opacity .25s ease;

}


.controls:hover {

  opacity:
    .9;

}


.controls button {

  border:
    none;

  background:
    transparent;

  padding:
    3px 5px;

  font-family:
    Arial,
    sans-serif;

  font-size:
    7px;

  letter-spacing:
    .13em;

  color:
    #575149;

  cursor:
    pointer;

}


.controls button:hover {

  color:
    #24211e;

}


/* ==================================================
   ACTIVE BUTTON
   ================================================== */

.controls button.active {

  text-decoration:
    underline;

  text-underline-offset:
    3px;

}


/* ==================================================
   MOBILE
   ================================================== */

@media (max-width: 420px) {

  .lamp {

    width:
      min(70%, 220px);

  }

  .glow {

    width:
      65%;

  }

  .controls {

    bottom:
      7px;

  }

}

</style>

</head>


<body>


<div
  class="lamp-room day"
  id="lampRoom"
>


  <!-- LIGHT -->

  <div
    class="glow"
    aria-hidden="true"
  ></div>


  <!-- LAMP -->

  <img
    src="lamp.png"
    class="lamp"
    alt=""
  >


  <!-- TEST CONTROLS -->

  <div
    class="controls"
  >

    <button
      id="dayButton"
      onclick="setMode('day')"
    >
      DAY
    </button>


    <button
      id="duskButton"
      onclick="setMode('dusk')"
    >
      DUSK
    </button>


    <button
      id="nightButton"
      onclick="setMode('night')"
    >
      NIGHT
    </button>


    <button
      id="autoButton"
      onclick="setMode('auto')"
      class="active"
    >
      AUTO
    </button>

  </div>


</div>


<script>

/* ==================================================
   BARCELONA
   ================================================== */

const LATITUDE =
  41.3874;

const LONGITUDE =
  2.1686;


/* ==================================================
   ELEMENTS
   ================================================== */

const lampRoom =
  document.getElementById(
    "lampRoom"
  );


const buttons = {

  day:
    document.getElementById(
      "dayButton"
    ),

  dusk:
    document.getElementById(
      "duskButton"
    ),

  night:
    document.getElementById(
      "nightButton"
    ),

  auto:
    document.getElementById(
      "autoButton"
    )

};


/* ==================================================
   SUNSET CALCULATION
   ================================================== */

function getSunset(date) {

  const day =
    Math.floor(
      (
        Date.UTC(
          date.getFullYear(),
          date.getMonth(),
          date.getDate()
        )
        -
        Date.UTC(
          date.getFullYear(),
          0,
          0
        )
      )
      /
      86400000
    );


  const radians =
    Math.PI / 180;


  const declination =
    -23.44 *
    Math.cos(
      radians *
      (
        360 / 365 *
        (day + 10)
      )
    );


  const hourAngle =
    Math.acos(

      (
        Math.cos(
          90.833 * radians
        )
        /
        (
          Math.cos(
            LATITUDE * radians
          )
          *
          Math.cos(
            declination * radians
          )
        )
      )
      -
      Math.tan(
        LATITUDE * radians
      )
      *
      Math.tan(
        declination * radians
      )

    ) / radians;


  const solarNoon =
    12
    -
    (
      LONGITUDE / 15
    );


  const sunsetHour =
    solarNoon
    +
    (
      hourAngle / 15
    );


  const sunset =
    new Date(date);


  sunset.setHours(
    Math.floor(
      sunsetHour
    ),
    Math.round(
      (
        sunsetHour
        -
        Math.floor(
          sunsetHour
        )
      )
      * 60
    ),
    0,
    0
  );


  return sunset;

}


/* ==================================================
   APPLY MODE
   ================================================== */

function applyMode(mode) {

  lampRoom.classList.remove(
    "day",
    "dusk",
    "lit"
  );


  if (mode === "day") {

    lampRoom.classList.add(
      "day"
    );

  }


  if (mode === "dusk") {

    lampRoom.classList.add(
      "dusk"
    );

  }


  if (mode === "night") {

    lampRoom.classList.add(
      "lit"
    );

  }


  Object.keys(buttons)
    .forEach(
      key => {

        buttons[key]
          .classList.toggle(
            "active",
            key === mode
          );

      }
    );

}


/* ==================================================
   REAL TIME MODE
   ================================================== */

function updateAuto() {

  const now =
    new Date();


  const sunset =
    getSunset(now);


  const duskStart =
    new Date(
      sunset.getTime()
      -
      45 * 60 * 1000
    );


  if (now >= sunset) {

    applyMode(
      "night"
    );

  }

  else if (
    now >= duskStart
  ) {

    applyMode(
      "dusk"
    );

  }

  else {

    applyMode(
      "day"
    );

  }

}


/* ==================================================
   PUBLIC TEST FUNCTION
   ================================================== */

function setMode(mode) {

  if (mode === "auto") {

    updateAuto();

  }

  else {

    applyMode(
      mode
    );

  }

}


/* ==================================================
   START
   ================================================== */

updateAuto();


/*
   Keep AUTO synchronized
   with real time.
*/

setInterval(
  () => {

    const autoButton =
      buttons.auto;

    if (
      autoButton.classList
        .contains("active")
    ) {

      updateAuto();

    }

  },
  60000
);

</script>


</body>

</html>
```
